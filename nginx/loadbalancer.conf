# ── Load Balancer — Nginx Reverse Proxy Configuration ────────────────────────
#
# This config is used by the 'loadbalancer' container.
# It is the ONLY container with a port published to the host (port 80).
# All user traffic enters here and is routed to either the backend or UI container.
#
# Routing rules:
#   /api/*      → backend:8080  (Spring Boot REST API)
#   /auction/*  → backend:8080  (Auction endpoints)
#   /payment/*  → backend:8080  (Payment endpoints)
#   /users/*    → backend:8080  (IAM / User endpoints)
#   /*          → ui:3000       (Static HTML/JS/CSS files)
#
# Docker's internal DNS resolves service names ('backend', 'ui') to container
# IP addresses automatically within the bidtech-network bridge network.

# ── Upstream: Spring Boot Backend ────────────────────────────────────────────
# 'backend' resolves to the backend container's IP via Docker internal DNS.
# Port 8080 is the Spring Boot embedded Tomcat port defined in application.properties.
upstream backend {
    server backend:8080;
}

# ── Upstream: Nginx UI Static Server ─────────────────────────────────────────
# 'ui' resolves to the UI container's IP via Docker internal DNS.
# Port 3000 is configured in nginx/ui.conf to avoid conflict with this load balancer.
upstream ui {
    server ui:3000;
}

server {
    # Listen on port 80 — this is the host-facing port published in docker-compose.yml.
    # Users access the application at http://localhost (port 80 is the HTTP default).
    listen 80;

    server_name localhost;

    # ── Proxy Headers ─────────────────────────────────────────────────────────
    # Forward original client information to upstream services so they can log
    # real client IPs and behave correctly behind the proxy.

    # Pass the original Host header so upstream services know the requested hostname
    proxy_set_header Host              $host;

    # Pass the real client IP address (not the load balancer's internal IP)
    proxy_set_header X-Real-IP         $remote_addr;

    # Append to the chain of proxies — useful if multiple proxies are in the path
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Tell upstream whether the original request was HTTP or HTTPS
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Route: Catalogue & other /api/* endpoints → Backend ──────────────────
    # Matches all Spring Boot REST API calls:
    #   /api/catalogue/products, /api/catalogue/health, etc.
    location /api/ {
        proxy_pass http://backend;
    }

    # ── Route: Auction endpoints → Backend ───────────────────────────────────
    # Matches all auction management calls:
    #   /auction/create, /auction/{id}/bid, /auction/{id}/end, etc.
    location /auction/ {
        proxy_pass http://backend;
    }

    # ── Route: Payment endpoints → Backend ───────────────────────────────────
    # Matches all payment processing calls:
    #   /payment/process, /payment/status/{id}, /payment/receipt/{id}
    location /payment/ {
        proxy_pass http://backend;
    }

    # ── Route: User / IAM endpoints → Backend ────────────────────────────────
    # Matches all user management calls. Uses regex to handle both /users and /users/
    # because Spring Boot 4.x does not match trailing slashes by default.
    location ~ ^/users(/.*)?$ {
        proxy_pass http://backend;
    }

    # ── Route: Everything else → UI container ────────────────────────────────
    # Catch-all for any request not matched above.
    # This serves all static frontend files:
    #   /, /index.html, /catalogue.html, /auction.html, /payment.html
    #   /catalogue.js, and any other assets
    # Must be defined LAST — Nginx evaluates location blocks in order and
    # this block would match everything if placed before the specific routes.
    location / {
        proxy_pass http://ui;
    }
}
