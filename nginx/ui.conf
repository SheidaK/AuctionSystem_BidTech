# ── UI Container — Nginx Server Configuration ─────────────────────────────────
#
# This config is used by the 'ui' container (Dockerfile.ui).
# It serves the static frontend files (HTML, JS, CSS) for the BidTech application.
#
# Port 3000 is used instead of the default 80 to avoid conflicting with the
# load balancer container, which owns port 80 on the Docker network.
# The UI container is NOT directly accessible from the host — all requests
# arrive via the load balancer which proxies /* to this container.

server {
    # Listen on port 3000 inside the Docker network.
    # 3000 is chosen to avoid conflict with the load balancer on port 80.
    listen 3000;

    server_name localhost;

    # Root directory where static files were copied during image build.
    # See Dockerfile.ui: COPY src/main/resources/static/ /usr/share/nginx/html/
    root /usr/share/nginx/html;

    # Default file to serve when a directory is requested (e.g. GET /)
    index index.html;

    # ── Static File Serving ───────────────────────────────────────────────────
    # try_files checks for the requested file in order:
    #   1. $uri          — exact file match (e.g. /catalogue.js)
    #   2. $uri/         — directory match (e.g. /assets/)
    #   3. /index.html   — fallback for any path not found on disk
    # The fallback to index.html ensures that page-to-page navigation works
    # even if the browser requests a path that doesn't map to a physical file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
