<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — BidTech IAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { DEFAULT: '#667eea', dark: '#5568d3' } } } }
        }
    </script>
    <style>
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>
<body class="bg-brand-gradient min-h-screen font-sans">

    <!-- ── Shared Navigation Bar ── -->
    <nav class="bg-nav-gradient shadow-lg">
        <div class="max-w-6xl mx-auto px-6 flex items-center gap-1">
            <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
            <a href="/index.html"   class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">📦 Catalogue</a>
            <a href="/auction.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔨 Auction</a>
            <a href="/users.html"   class="text-white bg-white/20 px-4 py-4 text-sm font-medium rounded hover:bg-white/30 transition">👤 Users</a>
            <a href="/pay.html"     class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">💳 Payment</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto my-8 bg-white rounded-2xl shadow-2xl overflow-hidden">

        <header class="bg-brand-gradient text-white px-8 py-8">
            <h1 class="text-3xl font-bold mb-1">👤 User Management</h1>
            <p class="text-white/90">IAM Service — list, register, update, delete and reset passwords</p>
        </header>

        <!-- ── Tab bar ── -->
        <div class="flex bg-gray-50 border-b-2 border-gray-200 overflow-x-auto">
            <button onclick="switchTab('list')"     id="btn-list"     class="tab-btn px-6 py-4 text-sm font-semibold text-brand border-b-2 border-brand bg-white whitespace-nowrap">📋 User List</button>
            <button onclick="switchTab('register')" id="btn-register" class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">➕ Register</button>
            <button onclick="switchTab('update')"   id="btn-update"   class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">✏️ Update</button>
            <button onclick="switchTab('delete')"   id="btn-delete"   class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">🗑️ Delete</button>
            <button onclick="switchTab('reset')"    id="btn-reset"    class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">🔑 Reset Password</button>
        </div>

        <!-- ── TAB 1: User List ── GET /users -->
        <div id="tab-list" class="tab-panel p-8">
            <div class="flex gap-3 mb-6">
                <input type="text" id="searchInput" placeholder="Search by username..." oninput="handleSearch()"
                    class="flex-1 px-4 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand transition">
                <button onclick="loadUsers()" class="px-5 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition shadow-sm">🔄 Refresh</button>
            </div>
            <div class="overflow-x-auto" id="usersContainer">
                <div class="text-center py-12 text-gray-400">Loading users...</div>
            </div>
        </div>

        <!-- ── TAB 2: Register ── POST /users -->
        <div id="tab-register" class="tab-panel hidden p-8">
            <h2 class="text-xl font-bold text-gray-700 mb-6">Register New User</h2>
            <form id="registerForm" onsubmit="registerUser(event)" class="space-y-4 max-w-2xl">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">First Name *</label>
                        <input type="text" id="reg-firstName" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Last Name *</label>
                        <input type="text" id="reg-lastName" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Username *</label>
                    <input type="text" id="reg-userName" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Email *</label>
                    <input type="email" id="reg-email" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Role</label>
                    <select id="reg-role" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Street Number</label>
                        <input type="text" id="reg-streetNumber" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Street Name</label>
                        <input type="text" id="reg-streetName" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">City</label>
                        <input type="text" id="reg-city" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Postal Code</label>
                        <input type="text" id="reg-postalCode" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Country</label>
                    <input type="text" id="reg-country" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <button type="submit" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition shadow-sm">Register User</button>
                <div id="reg-msg" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>
            </form>
        </div>

        <!-- ── TAB 3: Update ── PUT /users/{id} -->
        <div id="tab-update" class="tab-panel hidden p-8">
            <h2 class="text-xl font-bold text-gray-700 mb-6">Update User Information</h2>
            <form id="updateForm" onsubmit="updateUser(event)" class="space-y-4 max-w-2xl">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">User ID *</label>
                    <input type="number" id="upd-id" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">First Name</label>
                        <input type="text" id="upd-firstName" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Last Name</label>
                        <input type="text" id="upd-lastName" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Username</label>
                    <input type="text" id="upd-userName" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Email</label>
                    <input type="email" id="upd-email" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Role</label>
                    <select id="upd-role" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
                        <option value="">— no change —</option>
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Street Number</label>
                        <input type="text" id="upd-streetNumber" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Street Name</label>
                        <input type="text" id="upd-streetName" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">City</label>
                        <input type="text" id="upd-city" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Postal Code</label>
                        <input type="text" id="upd-postalCode" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Country</label>
                    <input type="text" id="upd-country" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <button type="submit" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition shadow-sm">Update User</button>
                <div id="upd-msg" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>
            </form>
        </div>

        <!-- ── TAB 4: Delete ── DELETE /users/{id} -->
        <div id="tab-delete" class="tab-panel hidden p-8">
            <h2 class="text-xl font-bold text-gray-700 mb-6">Delete User</h2>
            <form id="deleteForm" onsubmit="deleteUser(event)" class="space-y-4 max-w-xs">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">User ID *</label>
                    <input type="number" id="del-id" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <button type="submit" class="px-6 py-2.5 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600 transition shadow-sm">Delete User</button>
                <div id="del-msg" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>
            </form>
        </div>

        <!-- ── TAB 5: Reset Password ── PUT /users/reset-password/{userName} -->
        <div id="tab-reset" class="tab-panel hidden p-8">
            <h2 class="text-xl font-bold text-gray-700 mb-6">Reset Password</h2>
            <form id="resetForm" onsubmit="resetPassword(event)" class="space-y-4 max-w-sm">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Username *</label>
                    <input type="text" id="rst-userName" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">New Password *</label>
                    <input type="password" id="rst-password" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>
                <button type="submit" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition shadow-sm">Reset Password</button>
                <div id="rst-msg" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>
            </form>
        </div>

    </div>

<script>
    // All fetch calls use relative URLs — routed through the Nginx load balancer.
    // The load balancer proxies /users/* to the Spring Boot backend on port 8080.

    /**
     * Switches the visible tab and updates button styles.
     * @param {string} name - Tab identifier
     */
    function switchTab(name) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('text-brand', 'border-brand', 'bg-white');
            b.classList.add('text-gray-500', 'border-transparent');
        });
        document.getElementById('tab-' + name).classList.remove('hidden');
        const btn = document.getElementById('btn-' + name);
        btn.classList.add('text-brand', 'border-brand', 'bg-white');
        btn.classList.remove('text-gray-500', 'border-transparent');
        // Auto-refresh the list whenever the list tab is opened
        if (name === 'list') loadUsers();
    }

    /** Shows a status message with colour coding. */
    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        const styles = { success: 'bg-green-50 text-green-800 border border-green-200', error: 'bg-red-50 text-red-800 border border-red-200' };
        el.className = `px-4 py-3 rounded-lg text-sm font-medium ${styles[type]}`;
        el.textContent = text;
    }

    /** Loads all users via GET /users. @returns {Promise<void>} */
    async function loadUsers() {
        const c = document.getElementById('usersContainer');
        c.innerHTML = '<div class="text-center py-12 text-gray-400">Loading users...</div>';
        try {
            const res = await fetch('/users');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            renderTable(await res.json());
        } catch (err) {
            c.innerHTML = `<div class="px-4 py-3 bg-red-50 text-red-800 rounded-lg text-sm">Error: ${err.message}</div>`;
        }
    }

    /**
     * Renders users as a Tailwind-styled table.
     * @param {Array} users - User objects from the IAM API
     */
    function renderTable(users) {
        const c = document.getElementById('usersContainer');
        if (!users.length) { c.innerHTML = '<div class="text-center py-12 text-gray-400">No users found.</div>'; return; }
        // Password is intentionally omitted — never display passwords in the UI
        const rows = users.map(u => `
            <tr class="border-b border-gray-100 hover:bg-gray-50">
                <td class="px-4 py-3 text-gray-500 text-sm">${u.id}</td>
                <td class="px-4 py-3 font-medium text-gray-700 text-sm">${u.firstName} ${u.lastName}</td>
                <td class="px-4 py-3 text-gray-500 text-sm">${u.userName}</td>
                <td class="px-4 py-3 text-gray-500 text-sm">${u.email}</td>
                <td class="px-4 py-3 text-sm">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${u.role==='ADMIN'?'bg-green-100 text-green-800':'bg-blue-100 text-blue-800'}">${u.role||'USER'}</span>
                </td>
                <td class="px-4 py-3 text-gray-400 text-xs">${[u.streetNumber,u.streetName,u.city,u.postalCode,u.country].filter(Boolean).join(', ')||'—'}</td>
            </tr>`).join('');
        c.innerHTML = `
            <table class="w-full text-sm border-collapse">
                <thead><tr class="bg-gray-50 border-b-2 border-gray-200">
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">ID</th>
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">Name</th>
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">Username</th>
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">Email</th>
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">Role</th>
                    <th class="text-left px-4 py-3 font-semibold text-gray-600">Address</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    /** Searches by username or reloads full list. @returns {Promise<void>} */
    async function handleSearch() {
        const term = document.getElementById('searchInput').value.trim();
        if (!term) { loadUsers(); return; }
        try {
            const res = await fetch('/users/usernames/' + encodeURIComponent(term));
            if (res.status === 404) { renderTable([]); return; }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            renderTable([await res.json()]);
        } catch (err) {
            document.getElementById('usersContainer').innerHTML = `<div class="px-4 py-3 bg-red-50 text-red-800 rounded-lg text-sm">Search error: ${err.message}</div>`;
        }
    }

    /** Registers a new user via POST /users. @param {Event} event */
    async function registerUser(event) {
        event.preventDefault();
        const body = { firstName: document.getElementById('reg-firstName').value, lastName: document.getElementById('reg-lastName').value, userName: document.getElementById('reg-userName').value, email: document.getElementById('reg-email').value, role: document.getElementById('reg-role').value, streetNumber: document.getElementById('reg-streetNumber').value, streetName: document.getElementById('reg-streetName').value, city: document.getElementById('reg-city').value, postalCode: document.getElementById('reg-postalCode').value, country: document.getElementById('reg-country').value };
        try {
            const res = await fetch('/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            showMsg('reg-msg', 'User registered successfully!', 'success');
            document.getElementById('registerForm').reset();
        } catch (err) { showMsg('reg-msg', 'Error: ' + err.message, 'error'); }
    }

    /** Updates a user via PUT /users/{id}. @param {Event} event */
    async function updateUser(event) {
        event.preventDefault();
        const id = document.getElementById('upd-id').value;
        const body = { firstName: document.getElementById('upd-firstName').value, lastName: document.getElementById('upd-lastName').value, userName: document.getElementById('upd-userName').value, email: document.getElementById('upd-email').value, role: document.getElementById('upd-role').value, streetNumber: document.getElementById('upd-streetNumber').value, streetName: document.getElementById('upd-streetName').value, city: document.getElementById('upd-city').value, postalCode: document.getElementById('upd-postalCode').value, country: document.getElementById('upd-country').value };
        try {
            const res = await fetch('/users/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            showMsg('upd-msg', 'User updated successfully!', 'success');
        } catch (err) { showMsg('upd-msg', 'Error: ' + err.message, 'error'); }
    }

    /** Deletes a user via DELETE /users/{id}. @param {Event} event */
    async function deleteUser(event) {
        event.preventDefault();
        const id = document.getElementById('del-id').value;
        // Confirm before destructive action — deletion cannot be undone
        if (!confirm('Delete user ID ' + id + '? This cannot be undone.')) return;
        try {
            const res = await fetch('/users/' + id, { method: 'DELETE' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            showMsg('del-msg', 'User deleted successfully!', 'success');
            document.getElementById('deleteForm').reset();
        } catch (err) { showMsg('del-msg', 'Error: ' + err.message, 'error'); }
    }

    /** Resets a password via PUT /users/reset-password/{userName}. @param {Event} event */
    async function resetPassword(event) {
        event.preventDefault();
        const userName = document.getElementById('rst-userName').value;
        const password = document.getElementById('rst-password').value;
        try {
            const res = await fetch('/users/reset-password/' + encodeURIComponent(userName), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            showMsg('rst-msg', 'Password updated successfully!', 'success');
            document.getElementById('resetForm').reset();
        } catch (err) { showMsg('rst-msg', 'Error: ' + err.message + ' — check the username.', 'error'); }
    }

    // Load users immediately on page open
    loadUsers();
</script>
</body>
</html>
