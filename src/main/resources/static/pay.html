<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Service — BidTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { DEFAULT: '#667eea', dark: '#5568d3' } } } }
        }
    </script>
    <style>
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>
<body class="bg-brand-gradient min-h-screen font-sans">

<nav class="bg-nav-gradient shadow-lg">
    <div class="max-w-6xl mx-auto px-6 flex items-center gap-1">
        <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
        <a href="/index.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">📦 Catalogue</a>
        <a href="/auction.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔨 Auction</a>
        <a href="/users.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">👤 Users</a>
        <a href="/pay.html" class="text-white bg-white/20 px-4 py-4 text-sm font-medium rounded hover:bg-white/30 transition">💳 Payment</a>
        <a href="/notifications.html" id="notifLink" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔔 <span id="notifBadge"></span></a>
        <button onclick="logout()" class="text-white px-4 py-2 hover:bg-white/20 rounded">🚪 Logout</button>
    </div>
</nav>

<div class="max-w-4xl mx-auto my-8 bg-white rounded-2xl shadow-2xl overflow-hidden">
    <header class="bg-brand-gradient text-white px-8 py-8">
        <h1 class="text-3xl font-bold mb-1">💳 Payment Service</h1>
        <p class="text-white/90">Process payments, check status, and retrieve receipts</p>
    </header>

    <div class="flex bg-gray-50 border-b-2 border-gray-200 overflow-x-auto">
        <button onclick="switchTab('process')" id="btn-process" class="tab-btn px-6 py-4 text-sm font-semibold text-brand border-b-2 border-brand bg-white whitespace-nowrap">💰 Process Payment</button>
        <button onclick="switchTab('status')" id="btn-status" class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">🔍 Check Status</button>
        <button onclick="switchTab('receipt')" id="btn-receipt" class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">🧾 Get Receipt</button>
        <button onclick="switchTab('history')" id="btn-history" class="tab-btn px-6 py-4 text-sm font-semibold text-gray-500 border-b-2 border-transparent hover:text-brand hover:bg-indigo-50 whitespace-nowrap transition">📋 Payment History</button>
    </div>

    <!-- Tab: Process Payment -->
    <div id="tab-process" class="tab-panel p-8">
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Auction ID *</label>
                <input type="number" id="payAuctionId" placeholder="Enter Auction ID" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Amount ($) *</label>
                <input type="number" id="payAmount" placeholder="Enter amount" step="0.01" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
            </div>
        </div>
        <button onclick="processPayment()" class="px-6 py-2.5 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition">💳 Pay Now</button>
        <div id="processResult" class="hidden mt-4 px-4 py-3 rounded-lg text-sm font-medium"></div>
    </div>

    <!-- Tab: Check Status -->
    <div id="tab-status" class="tab-panel hidden p-8">
        <p class="text-sm text-gray-500 mb-6 pb-4 border-b border-gray-100">Look up payment status using the transaction ID.</p>
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-1">Transaction ID *</label>
            <input type="text" id="statusTxId" placeholder="e.g. 1774984971440" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
        </div>
        <button onclick="checkStatus()" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition">🔍 Check Status</button>
        <div id="statusResult" class="hidden mt-4 px-4 py-3 rounded-lg text-sm font-medium"></div>
    </div>

    <!-- Tab: Get Receipt -->
    <div id="tab-receipt" class="tab-panel hidden p-8">
        <p class="text-sm text-gray-500 mb-6 pb-4 border-b border-gray-100">Retrieve a receipt by Payment ID.</p>
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-1">Payment ID *</label>
            <input type="number" id="receiptPaymentId" placeholder="e.g. 1" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
        </div>
        <button onclick="getReceipt()" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition">🧾 Get Receipt</button>
        <div id="receiptResult" class="hidden mt-4 px-4 py-3 rounded-lg text-sm font-medium"></div>
        <div id="receiptCard" class="hidden mt-6 border-2 border-gray-200 rounded-xl overflow-hidden">
            <div class="bg-brand-gradient text-white px-6 py-4"><h3 class="text-lg font-bold">🧾 Receipt</h3></div>
            <div class="divide-y divide-gray-100" id="receiptBody"></div>
        </div>
    </div>

    <!-- Tab: Payment History -->
    <div id="tab-history" class="tab-panel hidden p-8">
        <p class="text-sm text-gray-500 mb-6 pb-4 border-b border-gray-100">All payment records.</p>
        <button onclick="loadHistory()" class="px-6 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition mb-4">🔄 Refresh</button>
        <div id="historyContainer" class="overflow-x-auto"><div class="text-center py-12 text-gray-400">Click Refresh to load.</div></div>
    </div>
</div>

<script>
function switchTab(name) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('text-brand','border-brand','bg-white');
        b.classList.add('text-gray-500','border-transparent');
    });
    document.getElementById('tab-'+name).classList.remove('hidden');
    const btn = document.getElementById('btn-'+name);
    btn.classList.add('text-brand','border-brand','bg-white');
    btn.classList.remove('text-gray-500','border-transparent');
}
function showMsg(id,text,type){
    const el=document.getElementById(id);
    const s={success:'bg-green-50 text-green-800 border border-green-200',error:'bg-red-50 text-red-800 border border-red-200',info:'bg-blue-50 text-blue-800 border border-blue-200'};
    el.className=`mt-4 px-4 py-3 rounded-lg text-sm font-medium ${s[type]}`;el.textContent=text;
}
async function processPayment(){
    const auctionId=document.getElementById('payAuctionId').value.trim();
    const amount=document.getElementById('payAmount').value.trim();
    const user=JSON.parse(localStorage.getItem('user'));
    if(!user||!user.id){alert("Please log in first.");return;}
    if(!auctionId||!amount){alert("Fill in Auction ID and Amount.");return;}
    try{
        const res=await fetch(`/api/payments/process?auctionId=${auctionId}&userId=${user.id}&amount=${amount}`,{method:'POST'});
        const result=await res.text();
        if(result.startsWith("Please")||result.startsWith("Negative")||result.startsWith("This auction")){
            showMsg('processResult','❌ '+result,'error');
        }else{showMsg('processResult','✅ Payment successful! TX: '+result,'success');}
    }catch(err){showMsg('processResult','❌ '+err.message,'error');}
}
async function checkStatus(){
    const txId=document.getElementById('statusTxId').value.trim();
    if(!txId){showMsg('statusResult','Enter a Transaction ID.','error');return;}
    try{
        const res=await fetch(`/api/payments/status/${encodeURIComponent(txId)}`);
        const text=await res.text();
        showMsg('statusResult',text.includes('NOT_FOUND')?'⚠️ '+text:'✅ '+text,text.includes('NOT_FOUND')?'error':'success');
    }catch(err){showMsg('statusResult','❌ '+err.message,'error');}
}
async function getReceipt(){
    const pid=document.getElementById('receiptPaymentId').value.trim();
    if(!pid){showMsg('receiptResult','Enter a Payment ID.','error');return;}
    document.getElementById('receiptCard').classList.add('hidden');
    try{
        const res=await fetch(`/api/payments/receipt/${pid}`);
        if(res.status===404){showMsg('receiptResult','⚠️ Not found.','error');return;}
        const r=await res.json();const amt=r.totalAmount??r.amount;
        document.getElementById('receiptBody').innerHTML=[
            ['Transaction ID',r.transactionId||'—'],['Status',r.status||'—'],
            ['Amount',amt!=null?'$'+Number(amt).toFixed(2):'—'],
            ['Shipping',r.shippingAddress||'—'],['Delivery',r.estimatedDelivery||r.deliveryTime||'5-7 days']
        ].map(([l,v])=>`<div class="flex justify-between px-6 py-3 text-sm"><span class="font-semibold text-gray-600">${l}</span><span class="text-gray-500">${v}</span></div>`).join('');
        showMsg('receiptResult','🧾 Loaded.','success');
        document.getElementById('receiptCard').classList.remove('hidden');
    }catch(err){showMsg('receiptResult','❌ '+err.message,'error');}
}
async function loadHistory(){
    const c=document.getElementById('historyContainer');
    c.innerHTML='<div class="text-center py-8 text-gray-400">Loading...</div>';
    try{
        const res=await fetch('/api/payments');const payments=await res.json();
        if(!payments.length){c.innerHTML='<div class="text-center py-8 text-gray-400">No payments.</div>';return;}
        c.innerHTML=`<table class="w-full text-sm border-collapse"><thead><tr class="bg-gray-50 border-b-2 border-gray-200">
            <th class="text-left px-4 py-3 font-semibold text-gray-600">ID</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">Auction</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">User</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">Amount</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">Status</th>
            <th class="text-left px-4 py-3 font-semibold text-gray-600">TX ID</th>
        </tr></thead><tbody>${payments.map(p=>`<tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-3 text-gray-500">${p.id}</td>
            <td class="px-4 py-3 text-gray-500">#${p.auctionId}</td>
            <td class="px-4 py-3 text-gray-500">#${p.userId}</td>
            <td class="px-4 py-3 font-semibold text-brand">$${p.amount.toFixed(2)}</td>
            <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800">${p.status}</span></td>
            <td class="px-4 py-3 text-gray-400 text-xs">${p.transactionId}</td>
        </tr>`).join('')}</tbody></table>`;
    }catch(err){c.innerHTML='<div class="bg-red-50 text-red-800 rounded-lg text-sm p-3">Error: '+err.message+'</div>';}
}
// Notification badge polling
async function updateNotifBadge(){
    try{
        const res=await fetch('/api/notifications');const n=await res.json();
        const badge=document.getElementById('notifBadge');
        badge.textContent=n.length>0?`(${n.length})`:'';
    }catch(e){}
}
setInterval(updateNotifBadge,5000);updateNotifBadge();
function logout(){localStorage.removeItem('user');window.location.href='/login.html';}
const u=JSON.parse(localStorage.getItem('user'));if(!u)window.location.href='/login.html';
</script>
<script src="chat-widget.js"></script>
</body>
</html>
