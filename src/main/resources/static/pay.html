<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment — BidTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#667eea', dark: '#5568d3' } } } } }
    </script>
    <style>
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>
<body class="bg-brand-gradient min-h-screen font-sans">

<nav class="bg-nav-gradient shadow-lg">
    <div class="max-w-6xl mx-auto px-6 flex items-center gap-1">
        <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
        <a href="/index.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">📦 Catalogue</a>
        <a href="/auction.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔨 Auction</a>
        <a href="/users.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">👤 Users</a>
        <a href="/pay.html" class="text-white bg-white/20 px-4 py-4 text-sm font-medium rounded hover:bg-white/30 transition">💳 Payment</a>
        <a href="/notifications.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔔 Notifications</a>
        <button onclick="logout()" class="text-white px-4 py-2 hover:bg-white/20 rounded">🚪 Logout</button>
    </div>
</nav>

<div class="max-w-4xl mx-auto my-8 bg-white rounded-2xl shadow-2xl overflow-hidden">
    <header class="bg-brand-gradient text-white px-8 py-8">
        <h1 class="text-3xl font-bold mb-1">💳 Payment Service</h1>
        <p class="text-white/90">Won auctions awaiting your payment</p>
    </header>

    <div class="p-8">
        <div id="paymentList" class="space-y-6"></div>
        <div id="processResult" class="hidden mt-6 px-6 py-4 rounded-2xl text-center text-lg font-medium"></div>
    </div>
</div>

<script>
    async function loadPaymentList() {
        const user = JSON.parse(localStorage.getItem('user'));
        const container = document.getElementById('paymentList');

        if (!user || !user.id) {
            container.innerHTML = `<div class="bg-red-50 text-red-800 p-6 rounded-2xl text-center font-medium">Please log in to view payments.</div>`;
            return;
        }

        try {
            const res = await fetch('/auction/all');
            const auctions = await res.json();

            const wonEnded = auctions.filter(a => !a.active && a.highestBidderId === user.id);

            if (wonEnded.length === 0) {
                container.innerHTML = `<div class="bg-gray-50 border border-gray-200 rounded-2xl p-8 text-center"><h3 class="font-semibold text-xl text-gray-700">No won auctions yet</h3></div>`;
                return;
            }

            const resPayments = await fetch('/api/payments');
            const allPayments = await resPayments.json();

            container.innerHTML = '';

            for (const auction of wonEnded) {
                const productRes = await fetch(`/api/catalogue/products/${auction.itemId}`);
                const product = await productRes.json();

                const hasPaid = allPayments.some(p => p.auctionId === auction.id && (p.status === 'SUCCESS' || p.status === 'COMPLETED'));

                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-center gap-6';

                if (hasPaid) {
                    card.innerHTML = `
                        <div class="flex-1">
                            <h3 class="font-semibold text-green-800 mb-1">Item has been purchased</h3>
                            <p class="text-2xl font-medium text-gray-800">${product.name}</p>
                            <p class="text-sm text-gray-500">Auction #${auction.id} • $${auction.highestBid.toFixed(2)}</p>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex-1">
                            <h3 class="font-semibold text-brand mb-1">You won this auction!</h3>
                            <p class="text-2xl font-medium text-gray-800">${product.name}</p>
                            <p class="text-sm text-gray-500">Auction #${auction.id} • Final bid: $${auction.highestBid.toFixed(2)}</p>
                        </div>
                        <button onclick="openPaymentModal(${auction.id}, ${auction.highestBid}, '${product.name.replace(/'/g, "\\'")}')"
                                class="bg-brand hover:bg-brand-dark text-white font-medium px-8 py-4 rounded-2xl text-lg transition">
                            Pay Now
                        </button>
                    `;
                }
                container.appendChild(card);
            }
        } catch (e) {
            container.innerHTML = `<div class="bg-red-50 text-red-800 p-6 rounded-2xl text-center font-medium">Error loading payments.</div>`;
        }
    }

    async function processPayment(auctionId, amount, itemName) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user.id) return alert("Please log in first.");

        try {
            const res = await fetch(`/api/payments/process?auctionId=${auctionId}&userId=${user.id}&amount=${amount}&itemName=${encodeURIComponent(itemName)}`, { method: 'POST' });
            const result = await res.text();

            if (res.ok) {
                document.getElementById('processResult').innerHTML = `✅ Payment successful for Auction #${auctionId}!`;
                document.getElementById('processResult').className = 'bg-green-50 text-green-800 border border-green-200 px-6 py-4 rounded-2xl text-center text-lg font-medium mt-6';
                document.getElementById('processResult').classList.remove('hidden');

                loadPaymentList();

                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1200);
            } else {
                alert(result);
            }
        } catch (err) {
            alert("Payment failed.");
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    window.onload = loadPaymentList;

    let selectedAuctionId = null;
    let selectedAmount = null;
    let selectedItemName = null;

    function openPaymentModal(id, amount, name) {
        selectedAuctionId = id;
        selectedAmount = amount;
        selectedItemName = name;

        document.getElementById('paymentModal').classList.remove('hidden');
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').classList.add('hidden');
    }

    function confirmPayment() {
        const card = document.getElementById('cardNumber').value;
        const expiry = document.getElementById('expiry').value;
        const cvv = document.getElementById('cvv').value;

        if (!card || !expiry || !cvv) {
            alert("Please fill all fields");
            return;
        }

        if (card.length !== 16) {
            alert("Invalid card number");
            return;
        }

        closePaymentModal();

        processPayment(selectedAuctionId, selectedAmount, selectedItemName);
    }
</script>

<script src="chat-widget.js"></script>

<div id="paymentModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-96 shadow-xl">
        <h3 class="text-xl font-semibold mb-4">💳 Enter Card Details</h3>

        <input id="cardNumber" class="w-full border p-2 mb-3 rounded" placeholder="Card Number" maxlength="16">
        <input id="expiry" class="w-full border p-2 mb-3 rounded" placeholder="MM/YY">
        <input id="cvv" class="w-full border p-2 mb-4 rounded" placeholder="CVV" maxlength="3">

        <div class="flex justify-between">
            <button onclick="closePaymentModal()" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
            <button onclick="confirmPayment()" class="px-4 py-2 bg-green-600 text-white rounded">Confirm</button>
        </div>
    </div>
</div>

</body>
</html>
