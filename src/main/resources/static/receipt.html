<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt — BidTech</title>
    <!-- Auth guard — redirect to login if no user session exists in localStorage -->
    <script>
        if (!localStorage.getItem('user')) { window.location.href = '/login.html'; }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#667eea', dark: '#5568d3' } } } } }
    </script>
    <style>
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>
<body class="bg-brand-gradient min-h-screen font-sans">

<nav class="bg-nav-gradient shadow-lg">
    <div class="max-w-6xl mx-auto px-6 flex items-center gap-1">
        <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
        <a href="/index.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">📦 Catalogue</a>
        <a href="/auction.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔨 Auction</a>
        <a href="/users.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">👤 Users</a>
        <a href="/pay.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">💳 Payment</a>
        <a href="/receipt.html" class="text-white bg-white/20 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🧾 Receipt</a>
        <a href="/notifications.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔔 Notifications</a>
        <button onclick="logout()" class="text-white px-4 py-2 hover:bg-white/20 rounded">🚪 Logout</button>
    </div>
</nav>

<div class="max-w-2xl mx-auto my-10 bg-white rounded-2xl shadow-2xl overflow-hidden">

    <div class="bg-brand-gradient text-white px-8 py-8 text-center">
        <div class="text-5xl mb-3">🧾</div>
        <h1 class="text-3xl font-bold mb-1">Payment Receipt</h1>
        <p class="text-white/90">Thank you for your purchase!</p>
    </div>

    <div class="divide-y divide-gray-100">
        <div class="flex justify-between items-center px-8 py-4">
            <span class="text-sm font-semibold text-gray-600">Transaction ID</span>
            <span class="font-bold text-brand text-sm" id="txId">—</span>
        </div>
        <div class="flex justify-between items-center px-8 py-4">
            <span class="text-sm font-semibold text-gray-600">Item Price</span>
            <span class="font-bold text-brand text-lg" id="itemPrice">—</span>
        </div>
        <div class="flex justify-between items-center px-8 py-4">
            <span class="text-sm font-semibold text-gray-600">Shipping Cost (Regular + Expedited)</span>
            <span class="font-bold text-brand text-lg" id="shippingCost">—</span>
        </div>
        <div class="flex justify-between items-center px-8 py-4 border-t-2 border-gray-300">
            <span class="text-sm font-semibold text-gray-600">Total Paid</span>
            <span class="font-bold text-brand text-2xl" id="totalPaid">—</span>
        </div>
    </div>

    <div class="px-8 py-6 bg-gray-50 flex gap-3 justify-end">
        <a href="/pay.html" class="px-5 py-2.5 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition shadow-sm">← Back to Payment</a>
        <a href="/index.html" class="px-5 py-2.5 bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-300 transition">Browse Catalogue</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let paymentId = urlParams.get('paymentId');

    // If no paymentId in URL (common case after payment), load the latest payment
    if (!paymentId) {
        fetch('/api/payments')
            .then(res => res.json())
            .then(payments => {
                if (payments.length > 0) {
                    // Sort by ID descending and take the latest one
                    const latestPayment = payments.sort((a, b) => b.id - a.id)[0];
                    paymentId = latestPayment.id;
                    fetchReceipt(paymentId);
                }
            })
            .catch(() => {
                document.getElementById('txId').textContent = 'Error loading receipt';
            });
    } else {
        fetchReceipt(paymentId);
    }

    function fetchReceipt(id) {
        fetch(`/api/payments/receipt/${id}`)
            .then(res => {
                if (!res.ok) throw new Error('Receipt not found');
                return res.json();
            })
            .then(async receipt => {
                const totalPaid = receipt.totalAmount ?? receipt.amount ?? 0;
                let itemPrice = totalPaid;
                let totalShipping = 0;

                try {
                    const paymentsRes = await fetch('/api/payments');
                    const payments = await paymentsRes.json();
                    const payment = payments.find(p => p.id === parseInt(id));

                    if (payment && payment.auctionId) {
                        const auctionsRes = await fetch('/auction/all');
                        const auctions = await auctionsRes.json();
                        const auction = auctions.find(a => a.id === payment.auctionId);

                        if (auction) {
                            const winningBid = auction.highestBid;
                            let regularShipping = 0;

                            const productRes = await fetch(`/api/catalogue/products/${auction.itemId}`);
                            if (productRes.ok) {
                                const product = await productRes.json();
                                regularShipping = product.shippingCost || 0;
                            }

                            const expeditedShipping = totalPaid > winningBid ? (totalPaid - winningBid) : 0;

                            itemPrice = winningBid - regularShipping;
                            totalShipping = regularShipping + expeditedShipping;
                        }
                    }
                } catch (err) {}

                document.getElementById('txId').textContent = receipt.transactionId || '—';
                document.getElementById('itemPrice').textContent = `$${itemPrice.toFixed(2)}`;
                document.getElementById('shippingCost').textContent = `$${totalShipping.toFixed(2)}`;
                document.getElementById('totalPaid').textContent = `$${totalPaid.toFixed(2)}`;
            })
            .catch(err => {
                document.getElementById('txId').textContent = 'Error loading receipt';
            });
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }
</script>

<script src="chat-widget.js"></script>
</body>
</html>
