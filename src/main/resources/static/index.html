<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Catalogue — BidTech</title>
    <!-- Tailwind CSS CDN — loaded at runtime, no build step required. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Extend Tailwind with the BidTech brand colours so we can use
        // classes like bg-brand, text-brand, border-brand across all pages.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#667eea', dark: '#5568d3', purple: '#764ba2' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Line-clamp utility for truncating product descriptions to 2 lines */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Gradient background used on the page body and headers */
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>
<body class="bg-brand-gradient min-h-screen font-sans">

    <!-- ── Shared Navigation Bar ─────────────────────────────────────────────
         Full-width bar at the very top. Active link is highlighted with a
         slightly lighter background so the user knows which page they're on. -->
    <nav class="bg-nav-gradient shadow-lg">
        <div class="max-w-7xl mx-auto px-6 flex items-center gap-1">
            <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
            <a href="/index.html" class="text-white bg-white/20 px-4 py-4 text-sm font-medium rounded hover:bg-white/30 transition">📦 Catalogue</a>
            <a href="/auction.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔨 Auction</a>
            <a href="/users.html"   class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">👤 Users</a>
            <a href="/pay.html"     class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">💳 Payment</a>
            <script>
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.role === 'ADMIN') {
                    document.write('<a href="/notifications.html" class="text-white/85 px-4 py-4 text-sm font-medium rounded hover:bg-white/15 transition">🔔 Notifications</a>');
                }
            </script>
       		<button onclick="logout()" class="text-white px-4 py-2 hover:bg-white/20 rounded">
    🚪 Logout
</button>
        </div>
    </nav>

    <!-- ── Page container ── -->
    <div class="max-w-7xl mx-auto my-8 bg-white rounded-2xl shadow-2xl overflow-hidden">

        <!-- Page header -->
        <header class="bg-brand-gradient text-white text-center py-10 px-8">
            <h1 class="text-4xl font-bold mb-2">🏛️ Auction Catalogue</h1>
            <p class="text-white/90 text-lg">Browse and manage auction items</p>
        </header>

        <!-- ── Controls bar: search, filters, action buttons ── -->
        <div class="flex flex-wrap gap-3 items-center px-8 py-5 bg-gray-50 border-b border-gray-200">
            <!-- Search box — filters products client-side on input -->
            <div class="relative flex-1 min-w-64">
                <input type="text" id="searchInput" placeholder="Search products..."
                    class="w-full pl-4 pr-10 py-3 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand transition">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
            </div>

            <select id="categoryFilter"
                class="px-4 py-3 border-2 border-gray-200 rounded-lg text-sm bg-white cursor-pointer focus:outline-none focus:border-brand">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Jewelry">Jewelry</option>
                <option value="Art">Art</option>
                <option value="Books">Books</option>
                <option value="Other">Other</option>
            </select>

            <select id="statusFilter"
                class="px-4 py-3 border-2 border-gray-200 rounded-lg text-sm bg-white cursor-pointer focus:outline-none focus:border-brand">
                <option value="">All Status</option>
                <option value="ACTIVE">Active</option>
                <option value="DRAFT">Draft</option>
                <option value="SOLD">Sold</option>
            </select>

            <button onclick="loadProducts()"
                class="px-5 py-3 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition hover:-translate-y-0.5 shadow-sm">
                🔄 Refresh
            </button>
            <button onclick="showAddProductModal()"
                class="px-5 py-3 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition shadow-sm">
                ➕ Add Product
            </button>
        </div>

        <!-- ── Product grid — populated by catalogue.js ── -->
        <div id="productsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-8">
            <div class="col-span-full text-center py-16 text-gray-400 text-lg">Loading products...</div>
        </div>
    </div>

    <!-- ── Product Detail Modal ── -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="bg-brand-gradient text-white px-6 py-5 flex justify-between items-center rounded-t-2xl">
                <h2 class="text-xl font-bold">Product Details</h2>
                <button onclick="closeModal()" class="text-white text-2xl leading-none hover:text-white/70">&times;</button>
            </div>
            <div class="p-6" id="modalBody"></div>
        </div>
    </div>

    <!-- ── Add Product Modal ── -->
    <div id="addProductModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="bg-brand-gradient text-white px-6 py-5 flex justify-between items-center rounded-t-2xl">
                <h2 class="text-xl font-bold">Add New Product</h2>
                <button onclick="closeAddModal()" class="text-white text-2xl leading-none hover:text-white/70">&times;</button>
            </div>
            <div class="p-6">
                <form id="addProductForm" onsubmit="addProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Product Name *</label>
                        <input type="text" name="name" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Description *</label>
                        <textarea name="description" required rows="3" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand resize-y"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Category *</label>
                        <select name="category" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Jewelry">Jewelry</option>
                            <option value="Art">Art</option>
                            <option value="Books">Books</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">Starting Price *</label>
                            <input type="number" name="startingPrice" step="0.01" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">Reserve Price *</label>
                            <input type="number" name="reservePrice" step="0.01" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">Shipping Cost *</label>
                            <input type="number" name="shippingCost" step="0.01" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">End Date *</label>
                            <input type="datetime-local" name="endDate" required class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Keywords</label>
                        <input type="text" name="keywords" placeholder="e.g., laptop, gaming" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Condition</label>
                        <select name="condition" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
                            <option value="NEW">New</option>
                            <option value="USED">Used</option>
                            <option value="REFURBISHED">Refurbished</option>
                        </select>
                    </div>
                    <div class="flex gap-3 justify-end pt-2">
                        <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 bg-gray-500 text-white text-sm font-semibold rounded-lg hover:bg-gray-600 transition">Cancel</button>
                        <button type="submit" class="px-5 py-2.5 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition">Add Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- catalogue.js handles all product loading, filtering, and modal logic.
         It uses the API_BASE = '/api/catalogue' relative URL. -->
    <script src="catalogue.js"></script>

    <script>
        // ── Override catalogue.js display functions to use Tailwind classes ──

        /**
         * Renders the product grid with Tailwind-styled cards.
         * Overrides the original displayProducts function in catalogue.js.
         * @param {Array} products - Array of product objects from the API
         */
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');

            if (!products.length) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 text-gray-400">
                        <div class="text-6xl mb-4 opacity-30">📦</div>
                        <h2 class="text-xl font-semibold mb-2">No products found</h2>
                        <p class="text-sm">Try adjusting your filters or add a new product</p>
                    </div>`;
                return;
            }

            // Badge colour map — maps product status to Tailwind colour classes
            const badgeClass = {
                ACTIVE:   'bg-green-100 text-green-800',
                DRAFT:    'bg-yellow-100 text-yellow-800',
                SOLD:     'bg-red-100 text-red-800',
                INACTIVE: 'bg-gray-100 text-gray-600'
            };

            container.innerHTML = products.map(p => `
                <div onclick="showProductDetails(${p.id})"
                    class="bg-white border-2 border-gray-100 rounded-xl overflow-hidden cursor-pointer
                           transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:border-brand">
                    <!-- Product image placeholder with gradient -->
                    <div class="h-44 bg-brand-gradient flex items-center justify-center text-5xl">
                        ${getProductIcon(p.category)}
                    </div>
                    <div class="p-5">
                        <span class="inline-block px-3 py-1 bg-gray-100 text-gray-500 text-xs rounded-full mb-2">${p.category}</span>
                        <h3 class="text-lg font-bold text-gray-800 mb-1">${escapeHtml(p.name)}</h3>
                        <p class="text-gray-500 text-sm line-clamp-2 mb-4">${escapeHtml(p.description || 'No description')}</p>
                        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                            <span class="text-2xl font-bold text-brand">$${p.startingPrice.toFixed(2)}</span>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${badgeClass[p.status] || 'bg-gray-100 text-gray-600'}">${p.status}</span>
                        </div>
                    </div>
                </div>`).join('');
        }

        // ── Modal open/close — toggle Tailwind 'hidden' class ──

        /** Opens the product detail modal. */
        function openModal()    { document.getElementById('productModal').classList.remove('hidden'); }
        /** Closes the product detail modal. */
        function closeModal()   { document.getElementById('productModal').classList.add('hidden'); }
        /** Opens the add product modal. */
        function showAddProductModal() { document.getElementById('addProductModal').classList.remove('hidden'); }
        /** Closes the add product modal. */
        function closeAddModal() { document.getElementById('addProductModal').classList.add('hidden'); }

        // Close modals when clicking the backdrop (outside the modal box)
        ['productModal','addProductModal'].forEach(id => {
            document.getElementById(id).addEventListener('click', e => {
                if (e.target.id === id) document.getElementById(id).classList.add('hidden');
            });
        });

        /**
         * Overrides catalogue.js showProductDetails to render with Tailwind styles.
         * @param {number} productId - The product ID to fetch and display
         */
        async function showProductDetails(productId) {
            try {
                const res = await fetch(`/api/catalogue/products/${productId}`);
                const p = await res.json();

                const badgeClass = { ACTIVE:'bg-green-100 text-green-800', DRAFT:'bg-yellow-100 text-yellow-800', SOLD:'bg-red-100 text-red-800' };

                document.getElementById('modalBody').innerHTML = `
                    <div class="space-y-3 text-sm">
                        ${[
                            ['Product Name', escapeHtml(p.name)],
                            ['Description', escapeHtml(p.description || 'No description')],
                            ['Category', p.category],
                            ['Starting Price', `$${p.startingPrice?.toFixed(2)}`],
                            ['Reserve Price', `$${p.reservePrice?.toFixed(2)}`],
                            ['Shipping Cost', `$${(p.shippingCost||0).toFixed(2)}`],
                            ['End Date', p.endDate ? new Date(p.endDate).toLocaleString() : 'Not set'],
                            ['Condition', p.condition || 'Not specified'],
                            ['Keywords', p.keywords || 'None'],
                            ['Created', p.createdAt ? new Date(p.createdAt).toLocaleString() : '—'],
                        ].map(([label, val]) => `
                            <div class="flex justify-between py-2 border-b border-gray-100">
                                <span class="font-semibold text-gray-600">${label}</span>
                                <span class="text-gray-500 text-right max-w-xs">${val}</span>
                            </div>`).join('')}
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span class="font-semibold text-gray-600">Status</span>
                            <span class="px-3 py-0.5 rounded-full text-xs font-semibold ${badgeClass[p.status]||'bg-gray-100 text-gray-600'}">${p.status}</span>
                        </div>
                        ${p.status === 'ACTIVE' ? `
<div class="flex gap-3 justify-end pt-3">
    <button onclick="createAuctionFromProduct(${p.id}, ${p.startingPrice}, '${p.name}')"
        id="createAuctionBtn"
        class="px-4 py-2 bg-purple-600 text-white text-sm font-semibold rounded-lg hover:bg-purple-700 transition">
        🔨 Create Auction
    </button>
</div>` : `
<div class="flex gap-3 justify-end pt-3">
    <button onclick="activateProduct(${p.id})"
        class="px-4 py-2 bg-brand text-white text-sm font-semibold rounded-lg hover:bg-brand-dark transition">
        ✅ Activate
    </button>
    <button onclick="deleteProduct(${p.id})"
        class="px-4 py-2 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600 transition">
        🗑 Delete
    </button>
</div>`}
                    </div>`;
                openModal();
                const user = JSON.parse(localStorage.getItem("user"));

                if (!user || user.role !== "ADMIN") {
                    const btn = document.getElementById("createAuctionBtn");
                    if (btn) btn.style.display = "none";
                }            } catch (err) {
                alert('Error loading product details');
            }
        }

        // Logout — clears all session data and redirects to login page
        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }
        async function createAuctionFromProduct(productId, startingPrice, productName) {
            const user = JSON.parse(localStorage.getItem("user"));

            if (!user || user.role !== "ADMIN") {
                alert("Only admins can create auctions");
                return;
            }

            try {
                const productRes = await fetch(`/api/catalogue/products/${productId}`);
                const product = await productRes.json();

                const d = new Date(product.endDate);

                const isoEndDate =
                    d.getFullYear() + "-" +
                    String(d.getMonth()+1).padStart(2,'0') + "-" +
                    String(d.getDate()).padStart(2,'0') + "T" +
                    String(d.getHours()).padStart(2,'0') + ":" +
                    String(d.getMinutes()).padStart(2,'0') + ":" +
                    String(d.getSeconds()).padStart(2,'0');
                const res = await fetch(
                    `/auction/create?itemId=${productId}&startingPrice=${startingPrice}&endDate=${isoEndDate}&itemName=${encodeURIComponent(productName)}`,
                    { method: "POST" }
                );

                if (!res.ok) throw new Error("Failed");

                const data = await res.json();

                alert(`Auction created for "${productName}"`);

                // go to auction page
                window.location.href = "/auction.html";
            } catch (err) {
                console.error(err);
                alert("Error creating auction");
            }
        }
    </script>

<!-- chat-widget.js injects the floating chatbot button and panel. -->
<script src="chat-widget.js"></script>
</body>
</html>
