<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — BidTech</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#667eea', dark: '#5568d3', purple: '#764ba2' }
                    }
                }
            }
        }
    </script>

    <style>
        .bg-brand-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-nav-gradient   { background: linear-gradient(135deg, #4a3f8f 0%, #5a2d82 100%); }
    </style>
</head>

<body class="bg-brand-gradient min-h-screen font-sans">

    <!-- NAVBAR -->
    <nav class="bg-nav-gradient shadow-lg">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">

            <div class="flex items-center gap-1">
                <span class="text-white font-bold text-lg py-4 pr-5 mr-3 border-r border-white/20">🏛️ BidTech</span>
                
            </div>

            <div class="flex items-center gap-3">
                <span id="userDisplay" class="text-white/80 text-sm"></span>
                <button onclick="logout()" id="logoutBtn"
                    class="hidden px-4 py-2 bg-red-500 text-white text-sm rounded hover:bg-red-600 transition">
                    🚪 Logout
                </button>
            </div>

        </div>
    </nav>

    <!-- REGISTER CARD -->
    <div class="max-w-xl mx-auto mt-12 bg-white rounded-2xl shadow-2xl overflow-hidden">

        <header class="bg-brand-gradient text-white text-center py-8 px-6">
            <h1 class="text-3xl font-bold">➕ Create Account</h1>
            <p class="text-white/90 text-sm mt-1">Join BidTech to start bidding</p>
        </header>

        <div class="p-6">
            <form id="registerForm" class="space-y-4">

                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="firstName" placeholder="First Name" required
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                    <input type="text" id="lastName" placeholder="Last Name" required
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>

                <input type="text" id="userName" placeholder="Username" required
                    class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                <input type="email" id="email" placeholder="Email" required
                    class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                <input type="password" id="password" placeholder="Password" required
                    class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="streetNumber" placeholder="Street #"
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                    <input type="text" id="streetName" placeholder="Street Name"
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="city" placeholder="City"
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                    <input type="text" id="postalCode" placeholder="Postal Code"
                        class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">
                </div>

                <input type="text" id="country" placeholder="Country"
                    class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-lg text-sm focus:outline-none focus:border-brand">

                <button id="submitBtn" type="submit"
                    class="w-full py-3 bg-brand text-white rounded-lg font-semibold hover:bg-brand-dark transition">
                    🚀 Register
                </button>

                <div id="msg" class="hidden text-sm px-4 py-3 rounded-lg"></div>

                <p class="text-center text-sm text-gray-500">
                    Already have an account?
                    <a href="/login.html" class="text-brand font-medium hover:underline">Login</a>
                </p>

            </form>
        </div>
    </div>

  <script>
    function showMsg(text, type) {
        const el = document.getElementById('msg');
        const styles = {
            success: 'bg-green-50 text-green-800 border border-green-200',
            error: 'bg-red-50 text-red-800 border border-red-200'
        };
        el.className = 'text-sm px-4 py-3 rounded-lg ' + styles[type];
        el.textContent = text;
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('userEmail');
        window.location.reload();
    }

    function checkAuthUI() {
        const user = localStorage.getItem('userEmail');
        if (user) {
            document.getElementById('userDisplay').textContent = '👤 ' + user;
            document.getElementById('logoutBtn').classList.remove('hidden');
            window.location.href = '/index.html';
        }
    }

    // check if username or email exists
    async function checkDuplicate(field, value) {
        try {
            const res = await fetch(`/users/check-${field}/${encodeURIComponent(value)}`);
            if (!res.ok) return false; // treat as not existing if endpoint fails
            const data = await res.json();
            return data.exists; // expects { exists: true/false } from backend
        } catch (err) {
            console.error(err);
            return false;
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Registering...';

        const userName = document.getElementById('userName').value.trim();
        const email = document.getElementById('email').value.trim();

        // Check duplicates first
        if (await checkDuplicate('username', userName)) {
            showMsg('Username already taken', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 Register';
            return;
        }

        if (await checkDuplicate('email', email)) {
            showMsg('Email already registered', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 Register';
            return;
        }

        const body = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            userName,
            email,
            password: document.getElementById('password').value,
            role: "USER",
            streetNumber: document.getElementById('streetNumber').value,
            streetName: document.getElementById('streetName').value,
            city: document.getElementById('city').value,
            postalCode: document.getElementById('postalCode').value,
            country: document.getElementById('country').value
        };

        try {
            const res = await fetch('/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || 'Registration failed');
            }

            showMsg('Account created! Redirecting to login...', 'success');
            setTimeout(() => { window.location.href = '/login.html'; }, 1000);

        } catch (err) {
            showMsg(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '🚀 Register';
        }
    });

    // Run on load
    checkAuthUI();
</script>
</body>
</html>
